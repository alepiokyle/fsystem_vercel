<IfModule mod_proxy.c>
    <IfModule mod_proxy_http.c>
        # Proxy for Laravel Reverb WebSocket (port 8080)
        <Location /app>
            ProxyPass http://127.0.0.1:8080/app
            ProxyPassReverse http://127.0.0.1:8080/app
        </Location>

        # Proxy WebSocket connections for Reverb
        <Location /ws>
            ProxyPass ws://127.0.0.1:8080/ws
            ProxyPassReverse ws://127.0.0.1:8080/ws
        </Location>
    </IfModule>
</IfModule>

# Additional headers for WebSocket support
<IfModule mod_headers.c>
    Header always set Access-Control-Allow-Origin "*"
    Header always set Access-Control-Allow-Methods "GET, POST, OPTIONS"
    Header always set Access-Control-Allow-Headers "Content-Type, Authorization"
</IfModule>
